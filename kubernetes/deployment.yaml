
apiVersion: apps/v1

kind: Deployment

metadata:
  name: campuscare

spec:
  replicas: 2

  selector:
    matchLabels:
      app: campuscare

  template:
    metadata:
      labels:
        app: campuscare

    spec:
      containers:
        - name: campuscare

          image: YOUR_DOCKERHUB_USERNAME/campuscare:latest

          ports:
            - containerPort: 5000

          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"

            limits:
              memory: "256Mi"
              cpu: "500m"
